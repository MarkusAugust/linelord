<!doctype html>
<!--
  The picture a link to the demo page is shown with, on X and wherever else
  Open Graph is read. It is drawn once and committed as `og.png`; to draw it
  again after changing this file:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --hide-scrollbars --window-size=1200,630 \
      --screenshot=site/og.png site/card.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #14110d;
        color: #e8e2d4;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }
      .blade {
        position: absolute;
        inset: 0;
        background: url("blade.jpg") center / cover;
        opacity: 0.9;
      }
      .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #14110df5 0%, #14110dd9 50%, #14110d00 85%);
      }
      main {
        position: absolute;
        left: 80px;
        top: 0;
        bottom: 0;
        width: 760px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      h1 {
        margin: 0;
        font-size: 104px;
        letter-spacing: -0.02em;
        color: #c8a34a;
      }
      .tagline {
        margin: 18px 0 40px;
        font-size: 30px;
      }
      .quote {
        margin: 0;
        padding-left: 24px;
        border-left: 4px solid #a8452f;
        font-size: 22px;
        line-height: 1.5;
        color: #9a9383;
      }
      .install {
        position: absolute;
        left: 80px;
        bottom: 48px;
        font-size: 22px;
        color: #9a9383;
      }
      .install b {
        color: #e8e2d4;
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <div class="blade"></div>
    <div class="shade"></div>
    <main>
      <h1>LineLord</h1>
      <p class="tagline">Who holds your codebase, line by line.</p>
      <p class="quote">
        “To crush the bugs, see them driven from your repository, and to hear
        the lamentations of their stack traces!”<br />— Gorvek of Bonereach
      </p>
    </main>
    <p class="install">$ <b>brew install markusaugust/linelord/linelord</b></p>
  </body>
</html>
