name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        # Pinned rather than `latest`: an unpinned runtime means a Bun release
        # can turn a green rerun red without a line of this repository having
        # changed, and makes a failure impossible to reproduce locally.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bunx biome ci .

      - name: Test
        # --coverage applies the threshold in bunfig.toml, so a change that
        # strips tests from already-covered code fails here rather than later.
        run: bun test --coverage
