name: Release

# Least privilege by default; the one job that needs to write does so on its
# own. Before, every job in this workflow held a write-capable GITHUB_TOKEN.
permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      # Sync the tap to a release that already exists, without building or
      # publishing anything. This is how you recover when the tap update fails
      # on its own -- an expired token, most likely -- without re-tagging.
      tag:
        description: Existing release tag to sync the Homebrew tap to
        required: false
      # Build and smoke-test the binaries on every runner without publishing
      # anything: how a change to the build is proven before the next tag.
      build_only:
        description: Build the binaries on their own runners, publish nothing
        type: boolean
        default: false

jobs:
  # Each platform builds its own binaries. Cross-compiling everything from
  # macOS worked, but a Linux binary that has never been run on Linux before
  # it is published is a binary nobody has tested; here each runner executes
  # the one it can and checks the architecture of the other.
  build:
    if: github.event_name == 'push' || inputs.build_only == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runs-on: macos-latest
            script: release:macos
          - name: linux
            runs-on: ubuntu-24.04
            script: release:linux
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    # Builds only. The release is written by a job that runs none of this.
    permissions:
      contents: read
    steps:
      # persist-credentials is off because this job runs `bun install`, which
      # executes dependency lifecycle scripts, followed by the build. Nothing
      # here pushes with git, so nothing here needs credentials on disk.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        # Pinned, and deliberately the same version CI verifies against: the
        # binaries published from here are compiled by this runtime, so
        # tracking `latest` would ship artifacts built by a version nothing
        # had tested. Bump it together with the pin in ci.yml.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build binaries
        run: bun run ${{ matrix.script }}

      # The tarballs are what users get. Unpack them, run the one this runner
      # can execute, and check the architecture of the other, so a build that
      # silently produced the wrong target is caught here rather than by
      # whoever installs it.
      - name: Smoke-test the macOS binaries
        if: matrix.name == 'macos'
        run: |
          set -euo pipefail
          cd release
          for archive in linelord-*.tar.gz; do
            tar -xzf "$archive"
          done
          ./linelord-macos-arm64 --version
          file linelord-macos-arm64 | grep -q 'arm64'
          file linelord-macos-intel | grep -q 'x86_64'
          rm -f linelord-macos-arm64 linelord-macos-intel

      - name: Smoke-test the Linux binaries
        if: matrix.name == 'linux'
        run: |
          set -euo pipefail
          cd release
          for archive in linelord-*.tar.gz; do
            tar -xzf "$archive"
          done
          ./linelord-linux-x64 --version
          file linelord-linux-x64   | grep -q 'x86-64'
          file linelord-linux-arm64 | grep -q 'ARM aarch64'
          rm -f linelord-linux-x64 linelord-linux-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: release/linelord-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Publishing is the only write this workflow makes with GITHUB_TOKEN, and
  # this job does nothing else: no checkout, no dependencies, no build, so no
  # third-party code runs while the token is in hand.
  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release

      # Four tarballs, or the release is not whole. A build job that uploaded
      # nothing has already failed on if-no-files-found, but say so here too.
      - name: Check every platform arrived
        run: |
          set -euo pipefail
          cd release
          ls -l
          for expected in linelord-macos-arm64 linelord-macos-intel \
                          linelord-linux-x64 linelord-linux-arm64; do
            test -f "$expected.tar.gz" || { echo "::error::$expected.tar.gz is missing"; exit 1; }
          done

      - name: Create checksums
        run: |
          cd release
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release in Public Repo
        uses: softprops/action-gh-release@v3
        with:
          repository: MarkusAugust/linelord
          files: |
            release/*.tar.gz
            release/checksums.txt
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Without this, the tap has to be edited by hand after every release: a
  # version bump plus four checksums, with nothing checking the result. That
  # is how v0.7.2 came to ship a formula nobody could install for months.
  update-homebrew-tap:
    name: Update the Homebrew tap
    needs: release
    # On a tap-sync run the release is skipped, so `always()` is needed to
    # reach this job at all -- but a failed release must still stop the tap
    # from being pointed at a release that was never published, and a
    # build-only run publishes nothing to sync to.
    if: >-
      always()
      && ((github.event_name == 'workflow_dispatch' && inputs.build_only != true)
          || needs.release.result == 'success')
    runs-on: ubuntu-24.04
    # Only reads this repository's release metadata. The write it performs is
    # to the tap, authorised by HOMEBREW_TAP_TOKEN rather than by this token.
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tap token is configured, and the tag named
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::No tag to sync to. A manual run needs the tag input unless build_only is set."
            exit 1
          fi
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set. The release is published, but the Homebrew tap still points at the previous version. Add a fine-grained token with Contents: write on MarkusAugust/homebrew-linelord, then re-run this job."
            exit 1
          fi

      # The scripts that run below come from this repository, not from the tap.
      # Running the tap's own scripts meant this job executed code it does not
      # control while holding a write token for that same repository.
      - name: Checkout linelord, for the scripts this job runs
        uses: actions/checkout@v7
        with:
          path: linelord
          persist-credentials: false

      # persist-credentials is off so the tap token is never written into
      # tap/.git/config, where anything running in this job could read it.
      # Pushing supplies it explicitly instead.
      - name: Checkout the tap
        uses: actions/checkout@v7
        with:
          repository: MarkusAugust/homebrew-linelord
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false
          path: tap

      # Version and checksums are written from one source, so they cannot
      # drift apart the way they did before.
      - name: Rewrite the formula from the published release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 linelord/scripts/update_formula.py "$TAG" tap/Formula/linelord.rb

      - name: Verify the formula against the release it now names
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 linelord/scripts/verify_formula.py tap/Formula/linelord.rb

      - name: Commit and push
        working-directory: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formula already matches $TAG; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update formula to $TAG"
          git push \
            "https://x-access-token:${TAP_TOKEN}@github.com/MarkusAugust/homebrew-linelord.git" \
            HEAD:master
